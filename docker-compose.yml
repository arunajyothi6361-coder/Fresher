version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: classroom-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - classroom-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: classroom-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/virtual-classroom
      JWT_SECRET: your_jwt_secret
      FRONTEND_URL: http://localhost:3000
      AEB_API_KEY: ${AEB_API_KEY}
      AEB_API_ENDPOINT: ${AEB_API_ENDPOINT}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - classroom-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: classroom-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - classroom-network

volumes:
  mongodb_data:

networks:
  classroom-network:
    driver: bridge
